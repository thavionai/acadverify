# AcadVerify — local development environment
# Usage: docker compose up -d
# See docs/local-setup.md for full setup, docs/midnight-stack.md for versions.
#
# Five services: the three Midnight components (node, indexer, proof server)
# plus local stand-ins for AWS DynamoDB and S3.
#
# Midnight image versions are PINNED. They were resolved from Docker Hub via the
# midnight-tooling plugin's resolve-versions.sh and each tag was verified to
# exist. Do not switch these to :latest — the node, indexer, and proof server
# must be version-compatible with each other and with the target network.

services:
  # ---- Midnight: the chain itself (Substrate RPC) --------------------------
  node:
    image: midnightntwrk/midnight-node:0.22.5
    ports:
      - "9944:9944"
    environment:
      CFG_PRESET: "dev"
      SIDECHAIN_BLOCK_BENEFICIARY: "04bcf7ad3be7a5c790460be82a713af570f22e0f801f6659ab8e84a52be6969e"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9944/health"]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 20s

  # ---- Midnight: indexer — GraphQL chain state on :8088 --------------------
  indexer:
    image: midnightntwrk/indexer-standalone:4.2.1
    ports:
      - "8088:8088"
    environment:
      RUST_LOG: "indexer=info,chain_indexer=info,indexer_api=info,wallet_indexer=info,indexer_common=info,fastrace_opentelemetry=off,info"
      APP__APPLICATION__NETWORK_ID: "undeployed"
      APP__INFRA__NODE__URL: "ws://node:9944"
      APP__INFRA__STORAGE__PASSWORD: "indexer"
      APP__INFRA__PUB_SUB__PASSWORD: "indexer"
      APP__INFRA__LEDGER_STATE_STORAGE__PASSWORD: "indexer"
      # Local devnet secret only — never reuse this value outside local dev.
      APP__INFRA__SECRET: "303132333435363738393031323334353637383930313233343536373839303132"
    healthcheck:
      test: ["CMD-SHELL", "cat /var/run/indexer-standalone/running"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    depends_on:
      node:
        condition: service_healthy

  # ---- Midnight: proof server — generates the ZK proofs --------------------
  # First start downloads ZK parameters and can take several minutes. It is not
  # hung. This service is CPU- and memory-bound and is the latency bottleneck
  # for both issuance and verification (see docs/deployment.md).
  proof-server:
    image: midnightntwrk/proof-server:8.1.0
    command: ["midnight-proof-server -v"]
    ports:
      - "6300:6300"
    environment:
      RUST_BACKTRACE: "full"
      # Measured: issuance proving takes ~19s on a developer laptop. The default
      # is 2 workers, so two concurrent issuances already queue. This raises
      # THROUGHPUT, not single-proof latency — one proof is still ~19s.
      MIDNIGHT_PROOF_SERVER_NUM_WORKERS: "4"
      # Bound the queue so a burst sheds load instead of exhausting memory.
      # 0 (the default) means unlimited.
      MIDNIGHT_PROOF_SERVER_JOB_CAPACITY: "32"
    # No healthcheck on purpose: this image is distroless — it has no sh, curl,
    # or wget, so any CMD/CMD-SHELL probe fails and pins the service to
    # "unhealthy" forever. The chain-service probes it over HTTP instead and
    # reports it as its own entry in GET /chain/health.

  # ---- Local DynamoDB (stands in for AWS DynamoDB) -------------------------
  dynamodb:
    image: amazon/dynamodb-local:latest
    # Runs as root so it can write to the named volume: the image's default
    # user is dynamodblocal (uid 1000), but Docker creates the volume's mount
    # point root-owned, so sqlite fails with "unable to open database file"
    # and every API call hangs while the container still reports "Up".
    user: root
    command: -jar DynamoDBLocal.jar -sharedDb -dbPath /data
    ports:
      - "8000:8000"
    volumes:
      - dynamodb-data:/data

  # ---- Local S3-compatible storage (stands in for AWS S3) ------------------
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: acadverify
      MINIO_ROOT_PASSWORD: acadverify123
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - minio-data:/data

  # ---- App services — enable as their folders land -------------------------
  # chain-service: Node 22 + Midnight.js. FastAPI reaches Midnight only through
  # this sidecar (Midnight.js is TypeScript-only; Web3.py cannot talk to it).
  # Its image includes the compiled keys/ and zkir/ or proving fails at runtime.
  #
  # CHAIN_MODE=mock serves the identical HTTP contract with deterministic
  # fixtures, so backend/frontend can build before the live wiring lands.
  # Flipping to live changes nothing for consumers.
  chain-service:
    build: ./midnight/chain-service
    ports:
      - "8090:8090"
    environment:
      CHAIN_SERVICE_PORT: 8090
      MIDNIGHT_NETWORK_ID: undeployed
      MIDNIGHT_NODE_URL: http://node:9944
      MIDNIGHT_INDEXER_URL: http://indexer:8088/api/v4/graphql
      MIDNIGHT_INDEXER_WS: ws://indexer:8088/api/v4/graphql/ws
      MIDNIGHT_PROOF_SERVER_URL: http://proof-server:6300
      MIDNIGHT_ZK_CONFIG_PATH: ./managed/academic_credential
      MIDNIGHT_PRIVATE_STATE_PATH: /app/.private-state
      # Live mode only: the deployed contract (midnight/deployments/<net>.json,
      # written by `npm run deploy`) and the wallet seed. Empty in mock mode.
      CONTRACT_ADDRESS: "${CONTRACT_ADDRESS:-}"
      MIDNIGHT_WALLET_SEED: "${MIDNIGHT_WALLET_SEED:-}"
      # Demo-only tamper endpoint (the "forge" step of the demo storyline).
      # Interpolated from .env so local demos can enable it; MUST remain
      # false in any deployed config.
      ALLOW_DEBUG_ENDPOINTS: "${ALLOW_DEBUG_ENDPOINTS:-false}"
      # live mode needs the chain-service to reach the devnet by service name.
      CHAIN_MODE: "${CHAIN_MODE:-mock}"
    depends_on:
      - node
      - indexer
      - proof-server
    volumes:
      # Witness data (credential fields + salts). Lost => those credentials can
      # never be proven again. See docs/data-model.md.
      - private-state:/app/.private-state
      # midnight-js levelPrivateStateProvider store — same durability rules.
      - private-state-db:/app/midnight-level-db

  backend:
      build: ./backend
      ports:
        - "8080:8080"
      env_file: .env
      environment:
        DYNAMODB_ENDPOINT_URL: http://dynamodb:8000
        S3_ENDPOINT: http://minio:9000
        CHAIN_SERVICE_URL: http://chain-service:8090
      depends_on:
        - dynamodb
        - minio
      volumes:
        - ./backend:/app

  # frontend:
  #   build: ./frontend
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
  #   volumes:
  #     - ./frontend:/app
  #     - /app/node_modules

volumes:
  dynamodb-data:
  minio-data:
  private-state:
  private-state-db:

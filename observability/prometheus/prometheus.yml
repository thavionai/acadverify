global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Per-container CPU/memory/network/disk (every container on the host)
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # Host-level CPU/memory/disk/filesystem
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  # AcadVerify anomaly/fake-cert detector
  - job_name: acadverify-detector
    static_configs:
      - targets: ["anomaly-detector:9700"]

  # Midnight node exposes Substrate Prometheus metrics on container port 9615.
  # Enable once that port is published in the main compose file
  # (add "9615:9615" to the node service), then uncomment:
  # - job_name: midnight-node
  #   static_configs:
  #     - targets: ["host.docker.internal:9615"]

  # App services — uncomment as each starts exposing /metrics
  # - job_name: backend
  #   metrics_path: /metrics
  #   static_configs:
  #     - targets: ["host.docker.internal:8080"]
  # - job_name: chain-service
  #   metrics_path: /metrics
  #   static_configs:
  #     - targets: ["host.docker.internal:8090"]
